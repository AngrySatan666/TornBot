[package]
name = "tornbot"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ini = "1.3"
rand = "0.8"
reqwest = { version = "0.11", features = ["json", "blocking", "rustls-tls"] }
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
tokio = { version = "1.0", features = ["full"] }
